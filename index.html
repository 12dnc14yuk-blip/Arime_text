<html lang="ja">
<head>
<meta charset="utf-8">

<style>
*{box-sizing:border-box}
body{margin:0;background:#fff8ec;color:#5f3a1b;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.wrap{max-width:900px;margin:auto;padding:16px}
h1{margin:0 0 6px;font-size:28px}
.sub{margin:0 0 14px;color:#8d6b4b;font-size:14px;line-height:1.6}
.card{background:#fff;border:2px solid #ffd39a;border-radius:20px;padding:16px;box-shadow:0 8px 25px rgba(90,50,10,.06);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
button{border:0;border-radius:14px;min-height:48px;padding:12px;font:inherit;font-weight:800;cursor:pointer}
.template-btn{background:#fff2df;color:#8a5318;border:2px solid #ffd39a;text-align:left}
.template-btn small{display:block;font-weight:600;opacity:.7;margin-top:3px}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}
.copy{background:#ff9717;color:#fff} .copy-all{background:#5f3a1b;color:#fff} .clear{background:#ffe7cd;color:#8a5318}
textarea{width:100%;min-height:330px;resize:vertical;border:2px solid #ffd39a;border-radius:16px;padding:14px;font:inherit;font-size:15px;line-height:1.7;color:#5f3a1b;background:#fffdf8}
label{display:block;font-weight:800;margin-bottom:8px}
.tip{font-size:13px;line-height:1.6;color:#8d6b4b;margin-top:10px}
.status{margin-top:10px;font-size:13px;font-weight:700;color:#8a5318;min-height:20px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.controls{grid-template-columns:1fr}textarea{min-height:300px}}
</style>
</head>
<body>

<p class="sub">タイトルを押す → 必要なら少し直す → 全文コピーで完成！</p>

<div class="card"><div class="grid" id="templateGrid"></div></div>

<div class="card">
<label for="editor">今日の本文</label>
<textarea id="editor"></textarea>
<div class="controls">
<button class="copy" id="copyTextBtn">✍️ 本文だけコピー</button>
<button class="copy-all" id="copyAllBtn">📋 完成形を全文コピー</button>
<button class="clear" id="clearBtn">🧹 クリア</button>
</div>
<div class="status" id="status"></div>
<p class="tip">「きっといい日になりますように✊🏼」以降は固定。本文だけ差し替わります。</p>
</div>
</div>

{title:"なんか良い日",note:"理由ないけど楽しかった",body:"今日なんかめちゃくちゃいい日だった〜！\n何がって言われると説明できないんだけどww\nみんなと喋って笑って\n「今日も配信してよかったな〜」って思いました🐰\nこういう日また作ろうね✊🏼"}

const grid=document.getElementById('templateGrid');
const editor=document.getElementById('editor');
const status=document.getElementById('status');

function setStatus(t){status.textContent=t;setTimeout(()=>{if(status.textContent===t)status.textContent='';},1800)}

templates.forEach(t=>{
 const btn=document.createElement('button');
 btn.className='template-btn';
 btn.innerHTML=`${t.title}<small>${t.note}</small>`;
 btn.addEventListener('click',()=>{editor.value=t.body;setStatus(`「${t.title}」を読み込みました`);});
 grid.appendChild(btn);
});

async function copyText(text){
 try{await navigator.clipboard.writeText(text);}
 catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
}

document.getElementById('copyTextBtn').addEventListener('click',async()=>{
 await copyText(editor.value);setStatus('本文をコピーしました');
});

document.getElementById('copyAllBtn').addEventListener('click',async()=>{
 const full=`${intro}

${editor.value}

${fixedAfterBody}`;
 await copyText(full);setStatus('完成形を全文コピーしました');
});

document.getElementById('clearBtn').addEventListener('click',()=>{editor.value='';setStatus('クリアしました')});
editor.value=templates[0].body;
</script>
